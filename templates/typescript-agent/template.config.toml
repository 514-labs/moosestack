language = "typescript" # Must be typescript or python
description = "TypeScript agent starter with MCP tools, Moose-owned dashboard APIs, JWT RLS, Bedrock support, and Langfuse tracing."
post_install_print = """
Deploy on Boreal

Boreal is the fastest way to deploy your MooseStack app, built by the MooseStack team.

https://boreal.cloud

---------------------------------------------------------

Run this next:

📂 Go to your project directory:
    $ cd {project_dir}

📦 Install all dependencies:
    $ pnpm install

🔐 Create environment files:
    $ pnpm env:prepare

⚙️ Set environment variables:
    1. Set your LLM provider credentials in `packages/web-app/.env.local`.
    2. Keep `MOOSE_AUTH_MODE=local` for the built-in mock OIDC issuer during local dev.
    3. If you are using an existing ClickHouse instance, fill in the `MOOSE_CLICKHOUSE_CONFIG__*` overrides in `packages/moosestack-service/.env.local`.
    4. Optionally configure Langfuse and Bedrock Guardrails in `packages/web-app/.env.local`.

🌱 Seed starter data:
    $ pnpm seed

🚀 Start both services:
    $ pnpm dev:start

Or start each service separately:
    $ pnpm dev:moose    # Start MooseStack service first
    $ pnpm dev:web      # Start the web app after the Moose service is ready
"""
default_sloan_telemetry = "standard"

# Boreal one-click deploy configuration
[boreal]
enabled = true
display_name = "TypeScript Agent Starter"
short_description = "Build tenant-scoped TypeScript agents with MCP tools, Moose-owned dashboard APIs, and Langfuse tracing."
featured = true

# Env vars user must provide
[[boreal.env_vars]]
name = "AI_PROVIDER"
description = "LLM provider selection: anthropic, openai, or bedrock"

[[boreal.env_vars]]
name = "AUTH_SECRET"
description = "Auth.js session secret"

[[boreal.env_vars]]
name = "OIDC_ISSUER"
description = "Production OIDC issuer URL"

[[boreal.env_vars]]
name = "OIDC_CLIENT_ID"
description = "Production OIDC client ID"

[[boreal.env_vars]]
name = "OIDC_CLIENT_SECRET"
description = "Production OIDC client secret"
