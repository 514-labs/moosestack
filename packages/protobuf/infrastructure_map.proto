syntax = "proto3";

package moose.proto;

import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";

message InfrastructureMap {
  map<string, Topic> topics = 1;
  map<string, ApiEndpoint> api_endpoints = 2;
  map<string, Table> tables = 3;
  map<string, Dmv1View> dmv1_views = 4;
  map<string, TopicToTableSyncProcess> topic_to_table_sync_processes = 5;
  map<string, TopicToTopicSyncProcess> topic_to_topic_sync_processes = 6;
  map<string, FunctionProcess> function_processes = 7;

  //  add then when they have fields in rust
  //  OlapProcess block_db_processes = 8;
  //  ConsumptionApiWebServer consumption_api_web_server = 9;
  map<string, InitialDataLoad> initial_data_loads = 10;
  map<string, OrchestrationWorker> orchestration_workers = 11;

  map<string, SqlResource> sql_resources = 12;
  map<string, WebApp> web_apps = 13;

  // Version of Moose CLI that created or last updated this infrastructure map
  // Helps with debugging, compatibility tracking, and migration planning
  string moose_version = 19;

  string default_database = 15;

  // Structured materialized views (replaces SqlResource for MVs)
  map<string, MaterializedView> materialized_views = 16;
  // Structured views (replaces SqlResource for views)
  map<string, View> views = 17;
  // Workflow definitions
  map<string, Workflow> workflows = 18;

  // Row-level security policies
  map<string, SelectRowPolicy> select_row_policies = 20;

  // ClickHouse Dictionaries
  map<string, OlapDictionary> olap_dictionaries = 21;
}

message SourceLocation {
  string file = 1;
}

message Metadata {
  string description = 1;
  optional SourceLocation source = 2;
}

message Topic {
  optional string version = 1;
  string name = 2;
  google.protobuf.Duration retention_period = 3;
  repeated Column columns = 4;
  PrimitiveSignature source_primitive = 5;
  optional int32 partition_count = 6;
  optional int32 max_message_bytes = 7;
  Metadata metadata = 8;
  LifeCycle life_cycle = 9;
  // Optional Schema Registry configuration
  optional SchemaRegistry schema_registry = 10;
}

// Encodes schema reference used for Schema Registry integration
message SchemaRegistry {
  enum Encoding {
    JSON = 0;
    AVRO = 1;
    PROTOBUF = 2;
  }
  // Encoding/wire format; avoid reserved names in generators
  Encoding encoding = 1;
  oneof schema_ref {
    // Use a concrete schema ID
    int32 schema_id = 2;
    // Use subject name (latest version)
    string subject = 3;
    // Use subject name with explicit version
    SubjectVersion subject_version = 4;
  }
}

message SubjectVersion {
  string subject = 1;
  int32 version = 2;
}

message ApiEndpoint {
  string name = 1;
  oneof api_type {
    IngressDetails ingress = 2;
    EgressDetails egress = 3;
  }
  string path = 4;
  Method method = 5;
  optional string version = 6;
  PrimitiveSignature source_primitive = 7;
  Metadata metadata = 8;
  // Infrastructure components this API endpoint reads data from.
  repeated InfrastructureSignature pulls_data_from = 9;
  // Infrastructure components this API endpoint writes data to.
  repeated InfrastructureSignature pushes_data_to = 10;
}

message IngressDetails {
  string target_topic = 1;
  optional EndpointIngestionFormat format = 2 [deprecated = true];
  optional string dead_letter_queue = 3;
}

message EgressDetails {
  repeated ConsumptionQueryParam query_params = 1;
  // might be worth it to use google.protobuf.Value
  string output_schema = 2;
}

message ConsumptionQueryParam {
  string name = 1;
  ColumnType data_type = 2;
  bool required = 3;
}

enum EndpointIngestionFormat {
  option deprecated = true;
  JSON = 0;
  JSON_ARRAY = 1;
}

enum Method {
  GET = 0;
  POST = 1;
  PUT = 2;
  DELETE = 3;
}

message Table {
  string name = 1;
  repeated Column columns = 2;
  repeated string order_by = 3;
  optional string version = 4;
  PrimitiveSignature source_primitive = 5;

  bool deduplicate = 6 [deprecated = true];
  google.protobuf.StringValue engine = 7;
  Metadata metadata = 8;
  LifeCycle life_cycle = 9;

  // Hash of non-alterable engine parameters for change detection
  optional string engine_params_hash = 10;
  // Alterable table settings (can be changed with ALTER TABLE MODIFY SETTING)
  map<string, string> table_settings = 11;
  // Optional PARTITION BY expression for ClickHouse tables
  optional string partition_by = 12;

  // Next-version ORDER BY representation to match Rust enum
  // Non-breaking: keeps legacy order_by (field 3) while adding a structured variant
  optional OrderBy order_by2 = 13;
  // Optional secondary/data-skipping indexes
  repeated TableIndex indexes = 14;

  // Optional SAMPLE BY expression for ClickHouse tables
  optional string sample_by_expression = 15;

  // Optional TTL expression at table level (without leading 'TTL')
  optional string table_ttl_setting = 16;

  // Optional database name for multi-database support
  // When not specified, uses the global ClickHouse config database
  optional string database = 17;

  // Optional cluster name for ON CLUSTER support in ClickHouse
  optional string cluster_name = 18;

  // Optional PRIMARY KEY expression
  // When specified, overrides primary_key boolean flags on columns
  optional string primary_key_expression = 19;

  // Hash of table settings for change detection (including sensitive settings)
  // Used to detect settings changes without storing plaintext sensitive values
  optional string table_settings_hash = 20;

  // Optional table projections for alternative data ordering within parts
  repeated TableProjection projections = 21;

  // Per-table filter for `moose seed clickhouse`
  optional SeedFilter seed_filter = 22;

  // Table-level constraints
  repeated TableConstraint constraints = 23;
}

// DB-neutral representation of a table projection
message TableProjection {
  // The projection identifier as it appears after `PROJECTION` in the DDL
  string name = 1;
  // The parenthesised body (without the outer parentheses)
  string body = 2;
}

// DB-neutral representation of a table constraint
message TableConstraint {
  // The unique identifier or name of the constraint
  string name = 1;
  // The SQL or logical expression enforcing the constraint condition
  string expression = 2;
  // The category of the constraint (e.g., "CHECK", "ASSUME")
  string constraint_type = 3;
}

// Structured representation of ORDER BY to support either explicit fields

// or an arbitrary ClickHouse SQL expression.
message OrderBy {
  oneof t {
    // Explicit ordered list of fields
    OrderByFields fields = 1;
    // Arbitrary ClickHouse expression, e.g. "tuple()" or "(id, name)"
    string expression = 2;
  }
}

message OrderByFields {
  repeated string field = 1;
}

// DB-neutral representation of a table index
message TableIndex {
  string name = 1;
  string expression = 2;
  string type = 3;
  repeated string arguments = 4;
  uint64 granularity = 5;
}

// Per-table filtering for `moose seed clickhouse`
message SeedFilter {
  // Maximum rows to seed (falls back to CLI --limit, then global default)
  optional uint64 limit = 1;
  // ClickHouse SQL WHERE expression appended to the seed query
  optional string where_clause = 2;
}

message Dmv1View {
  string name = 1;
  string version = 2;
  oneof view_type {
    TableAlias table_alias = 3;
  }
}

message TableAlias {
  string source_table_name = 1;
}

// Reference to a table, optionally qualified with database
message TableReference {
  // Database name (empty means use default database)
  optional string database = 1;
  // Table name
  string table = 2;
}

// Represents a SELECT query with semantic information
message SelectQuery {
  // The raw SELECT SQL statement
  string sql = 1;
  // Tables/views referenced in the FROM clause(s)
  repeated TableReference source_tables = 2;
}

// User-defined ClickHouse View with an arbitrary SELECT query.
// Views are virtual tables that compute results on-demand.
message View {
  // Name of the view
  string name = 1;
  // Database where the view is created (empty = default database)
  optional string database = 2;
  // The SELECT query that defines the view
  SelectQuery select_query = 3;
  // Optional metadata for the view (e.g., description, source file)
  optional Metadata metadata = 4;
}

// ClickHouse Materialized View that writes transformed data to a target table.
// MVs run the SELECT query on insert and persist results.
message MaterializedView {
  // Name of the materialized view
  string name = 1;
  // Database where the MV is created (empty = default database)
  optional string database = 2;
  // The SELECT query that defines the transformation
  SelectQuery select_query = 3;
  // Target table where transformed data is written (the TO clause)
  TableReference target_table = 4;
  // Optional metadata for the materialized view (e.g., description, source file)
  optional Metadata metadata = 5;
  // Lifecycle management policy for the materialized view
  LifeCycle life_cycle = 6;
}

message TopicToTableSyncProcess {
  string source_topic_id = 1;
  string target_table_id = 2;
  repeated Column columns = 3;
  optional string version = 4;
  PrimitiveSignature source_primitive = 5;
}

message TopicToTopicSyncProcess {
  string source_topic_id = 1;
  string target_topic_id = 2;
  PrimitiveSignature source_primitive = 3;
}

message FunctionProcess {
  string name = 1;
  string source_topic = 2;
  repeated Column source_columns = 3;
  optional string target_topic = 4;
  map<string, string> target_topic_config = 5;
  repeated Column target_columns = 6;
  string executable = 7;
  optional string version = 8;
  PrimitiveSignature source_primitive = 9;
  optional int32 parallel_process_count = 10;
  optional Metadata metadata = 11;
  // Topic ID for the dead letter queue, used to construct namespace-prefixed topic name
  optional string dead_letter_queue_topic_id = 12;
}

message InitialDataLoad {
  Table table = 1;
  string topic = 2;
  optional uint64 progress = 3;
}

message Column {
  string name = 1;
  ColumnType data_type = 2;
  bool required = 3;
  bool unique = 4;
  bool primary_key = 5;
  // was an enum that we never used
  int32 default = 6 [deprecated = true];
  // Column default is now a free-form SQL expression passed as a string
  google.protobuf.StringValue default_expr = 9;

  map<string, string> annotations = 7;
  optional string comment = 8; // Column comment for metadata storage
  // Optional column-level TTL expression (without leading 'TTL')
  optional string ttl = 10;
  // Compression codec expression (e.g., "ZSTD(3)", "Delta, LZ4")
  optional string codec = 11;
  // Materialized expression
  optional string materialized = 12;
  // Alias expression (computed at query time, not stored)
  optional string alias = 13;
}

enum SimpleColumnType {
  STRING = 0;
  BOOLEAN = 1;
  INT = 2  [deprecated = true];
  BIGINT = 3;
  FLOAT = 4 [deprecated = true];
  DECIMAL = 5 [deprecated = true];
  // in clickhouse, this is the 32-bit date
  // otherwise, see DateType where the precision can be specified
  DATETIME = 6;
  // Framework Date (standard) -> ClickHouse Date32 (4 bytes)
  DATE = 7;
  // Framework Date16 (memory-optimized) -> ClickHouse Date (2 bytes)
  DATE16 = 8;
  IPV4 = 9;
  IPV6 = 10;

  UUID_TYPE = 13;
  JSON_COLUMN = 14;
  BYTES = 15;

  // Geometry types
  POINT = 16;
  RING = 17;
  LINE_STRING = 18;
  MULTI_LINE_STRING = 19;
  POLYGON = 20;
  MULTI_POLYGON = 21;
}

enum IntType {
  INT64 = 0; // this is what we defaulted to

  INT8 = 1;
  INT16 = 2;
  INT32 = 3;
  INT128 = 4;
  INT256 = 5;
  UINT8 = 6;
  UINT16 = 7;
  UINT32 = 8;
  UINT64 = 9;
  UINT128 = 10;
  UINT256 = 11;
}

enum FloatType {
  FLOAT64 = 0;
  FLOAT32 = 1;
}

message Decimal {
    int32 precision = 1;
    int32 scale = 2;
}

message Tuple {
  repeated string names = 1;
  repeated ColumnType types = 2;
}

message Map {
  ColumnType key_type = 1;
  ColumnType value_type = 2;
}

// JSON type with optional settings
message JsonTypedPath {
  // JSON path like "a.b[0].c"
  string path = 1;
  // Concrete type for the value at the path
  ColumnType type = 2;
}

message Json {
  // Limits for dynamic discovery
  optional uint64 max_dynamic_paths = 1;
  optional uint64 max_dynamic_types = 2;
  // List of typed paths (path, type)
  repeated JsonTypedPath typed_paths = 3;
  // Paths to skip during ingestion
  repeated string skip_paths = 4;
  // Regex patterns of paths to skip
  repeated string skip_regexps = 5;
}

// TODO: nullable not being a type, relying on `bool required`
// is causing some mess e.g. the special case array_of_nullable
message ColumnType {
  oneof t {
    SimpleColumnType simple = 1;
    DataEnum enum = 2;
    ColumnType array = 3;
    Nested nested = 4;

    ColumnType array_of_nullable = 5;
    Tuple tuple = 6;
    ColumnType nullable = 7;
    Map map = 8;

    // JSON with settings (non-breaking addition). Keep legacy `simple = JSON_COLUMN` for back-compat.
    Json json = 9;

    uint64 fixed_string = 11;

    DateType date_time = 12;
    Decimal decimal = 13;
    FloatType float = 14;
    IntType int = 15;
  }
}

message DateType {
  int32 precision = 1;
}

message DataEnum {
  string name = 1;
  repeated EnumMember values = 2;
}

message Nested {
  string name = 1;
  repeated Column columns = 2;
  bool jwt = 3;
}

message EnumMember {
  string name = 1;
  EnumValue value = 2;
}

message EnumValue {
  oneof value {
    int32 int_value = 1;
    string string_value = 2;
  }
}

message PrimitiveSignature {
  string name = 1;
  PrimitiveTypes primitive_type = 2;
}

enum PrimitiveTypes {
  DATA_MODEL = 0;
  FUNCTION = 1;
  DB_BLOCK = 2;
  CONSUMPTION_API = 3;
}

enum LifeCycle {
  FULLY_MANAGED = 0;
  DELETION_PROTECTED = 1;
  EXTERNALLY_MANAGED = 2;
}



message OrchestrationWorker {
  string supported_language = 1;
}

message SqlResource {
  string name = 1;
  repeated string setup = 2;
  repeated string teardown = 3;
  repeated InfrastructureSignature pulls_data_from = 5;
  repeated InfrastructureSignature pushes_data_to = 6;
  // Optional database name for multi-database support
  // When not specified, uses the global ClickHouse config database
  optional string database = 7;
  // Optional source file path where this SQL resource is defined
  string source_file = 8;
}

message InfrastructureSignature {
  oneof signature {
    string topic_id = 1;
    string table_id = 2;
    string dmv1_view_id = 3;
    string sql_resource_id = 4;
    string api_endpoint_id = 5;
    string topic_to_table_sync_process_id = 6;
    string materialized_view_id = 7;
    string view_id = 8;
    string select_row_policy_id = 9;
    string olap_dictionary_id = 10;
  }
}

message WebApp {
  string name = 1;
  string mount_path = 2;
  optional WebAppMetadata metadata = 3;
  // Infrastructure components this web app reads data from.
  repeated InfrastructureSignature pulls_data_from = 4;
  // Infrastructure components this web app writes data to.
  repeated InfrastructureSignature pushes_data_to = 5;
}

message WebAppMetadata {
  optional string description = 1;
}

message Workflow {
  // Unique workflow identifier
  string name = 1;
  // Cron schedule for automatic execution
  string schedule = 2;
  // Number of retry attempts on failure
  uint32 retries = 3;
  // Workflow timeout
  string timeout = 4;
  // Programming language of the workflow
  string language = 5;
  // Infrastructure components this workflow reads data from.
  repeated InfrastructureSignature pulls_data_from = 6;
  // Infrastructure components this workflow writes data to.
  repeated InfrastructureSignature pushes_data_to = 7;
}

// Row-level security policy for ClickHouse
message SelectRowPolicy {
  // Policy name
  string name = 1;
  // Tables the policy applies to (with optional per-table database)
  repeated TableReference tables = 2;
  // Column to filter on
  string column = 3;
  // JWT claim name that provides the filter value
  string claim = 4;
}

// --- ClickHouse Dictionary support ---

// DictionaryColumn represents an attribute/column in a ClickHouse dictionary
message DictionaryColumn {
  // Column name
  string name = 1;
  // ClickHouse type string (e.g., "UInt64", "String", "Nullable(String)")
  string type_string = 2;
  // Default value expression (DEFAULT)
  optional string default_value = 3;
  // Computed expression (EXPRESSION)
  optional string expression = 4;
  // IS_INJECTIVE attribute for optimized GROUP BY
  optional bool is_injective = 5;
  // IS_HIERARCHICAL attribute for parent-child lookups
  optional bool is_hierarchical = 6;
  // IS_OBJECT_ID attribute (MongoDB only)
  optional bool is_object_id = 7;
  // Column comment
  optional string comment = 8;
}

// DictionaryTableSource — dictionary reads from a ClickHouse table
message DictionaryTableSource {
  // Source table name
  string table = 1;
  // Source database (empty = default database)
  optional string database = 2;
  // Optional WHERE clause for row filtering
  optional string where_clause = 3;
  // Optional query for checking if data has changed (triggers reload)
  optional string invalidate_query = 4;
}

// DictionaryQuerySource — dictionary reads from an arbitrary SQL query
message DictionaryQuerySource {
  // The SELECT query
  string query = 1;
  // Optional query for checking if data has changed (triggers reload)
  optional string invalidate_query = 2;
}

// DictionaryLayout — memory layout and storage model for the dictionary
message DictionaryLayout {
  enum Type {
    FLAT = 0;
    HASHED = 1;
    SPARSE_HASHED = 2;
    HASHED_ARRAY = 3;
    RANGE_HASHED = 4;
    CACHE = 5;
    SSD_CACHE = 6;
    DIRECT = 7;
    IP_TRIE = 8;
    COMPLEX_KEY_HASHED = 9;
    COMPLEX_KEY_SPARSE_HASHED = 10;
    COMPLEX_KEY_HASHED_ARRAY = 11;
    COMPLEX_KEY_CACHE = 12;
    COMPLEX_KEY_SSD_CACHE = 13;
    COMPLEX_KEY_DIRECT = 14;
  }
  Type type = 1;
  // Hashed / SparseHashed / ComplexKeyHashed / ComplexKeySparseHashed
  optional uint64 initial_array_size = 2;
  optional double max_load_factor = 3;
  // HashedArray / ComplexKeyHashedArray
  optional uint32 shards = 4;
  // Cache / SsdCache / ComplexKeyCache / ComplexKeySsdCache
  optional uint64 size_in_cells = 5;
  optional uint32 max_threads_for_updates = 6;
  // SsdCache / ComplexKeySsdCache
  optional string ssd_path = 7;
  optional uint64 block_size = 8;
  optional uint64 file_size = 9;
  optional uint64 read_buffer_size = 10;
  optional uint64 write_buffer_size = 11;
  optional uint64 max_stored_keys = 12;
  // IpTrie
  optional bool access_to_key_from_attributes = 13;
  // RangeHashed
  optional string range_lookup_strategy = 14;
}

// DictionaryRangeLifetime — min/max seconds for range-based refresh
message DictionaryRangeLifetime {
  uint64 min = 1;
  uint64 max = 2;
}

// DictionaryLifetime — how often dictionary data is refreshed
message DictionaryLifetime {
  oneof t {
    // Static: LIFETIME(0) — never automatically refresh
    bool static_lifetime = 1;
    // Single: LIFETIME(N) — refresh every N seconds
    uint64 single = 2;
    // Range: LIFETIME(MIN N MAX M) — refresh between min and max seconds
    DictionaryRangeLifetime range = 3;
  }
}

// DictionaryHttpSource — external HTTP source
message DictionaryHttpSource {
  // Full URL of the HTTP endpoint serving dictionary data
  string url = 1;
  // ClickHouse input format (e.g. CSV, JSONEachRow, TSV)
  string format = 2;
  // HTTP method override; defaults to GET when absent
  optional string method = 3;
  // Optional SQL WHERE clause appended to the source query
  optional string where_clause = 4;
}

// DictionaryClickHouseSource — remote ClickHouse server as source
message DictionaryClickHouseSource {
  // Hostname or IP of the remote ClickHouse server
  string host = 1;
  // TCP port of the remote ClickHouse server
  uint32 port = 2;
  // Username for authentication
  string user = 3;
  // Password for authentication (stored as-is; mask before display)
  string password = 4;
  // Database name on the remote server
  string db = 5;
  // Table name on the remote server
  string table = 6;
  // Custom SQL query; overrides table when present
  optional string query = 7;
  // SQL WHERE clause appended to the generated SELECT
  optional string where_clause = 8;
  // Query whose result change triggers dictionary reload
  optional string invalidate_query = 9;
}

// DictionaryMysqlSource — MySQL database as source
message DictionaryMysqlSource {
  // Hostname or IP of the MySQL server
  string host = 1;
  // TCP port of the MySQL server
  uint32 port = 2;
  // Username for authentication
  string user = 3;
  // Password for authentication (stored as-is; mask before display)
  string password = 4;
  // Database name
  string db = 5;
  // Table name
  string table = 6;
  // Custom SQL query; overrides table when present
  optional string query = 7;
  // SQL WHERE clause appended to the generated SELECT
  optional string where_clause = 8;
  // Query whose result change triggers dictionary reload
  optional string invalidate_query = 9;
}

// DictionaryPostgresqlSource — PostgreSQL database as source
message DictionaryPostgresqlSource {
  // Hostname or IP of the PostgreSQL server
  string host = 1;
  // TCP port of the PostgreSQL server
  uint32 port = 2;
  // Username for authentication
  string user = 3;
  // Password for authentication (stored as-is; mask before display)
  string password = 4;
  // Database name
  string db = 5;
  // Table name
  string table = 6;
  // Custom SQL query; overrides table when present
  optional string query = 7;
  // SQL WHERE clause appended to the generated SELECT
  optional string where_clause = 8;
  // Query whose result change triggers dictionary reload
  optional string invalidate_query = 9;
}

// DictionaryRedisSource — Redis as source
message DictionaryRedisSource {
  // Hostname or IP of the Redis server
  string host = 1;
  // TCP port of the Redis server
  uint32 port = 2;
  // Optional password for Redis AUTH command
  optional string password = 3;
  // Redis database index (0-based); defaults to 0 when absent
  optional uint32 db_index = 4;
  // Storage type: simple, hash, range_hashed, etc.
  string storage_type = 5;
}

// DictionaryMongoDbSource — MongoDB as source
message DictionaryMongoDbSource {
  // Hostname or IP of the MongoDB server
  string host = 1;
  // TCP port of the MongoDB server
  uint32 port = 2;
  // Username for authentication
  string user = 3;
  // Password for authentication (stored as-is; mask before display)
  string password = 4;
  // Database name
  string db = 5;
  // Collection name
  string collection = 6;
}

// DictionaryExecutableSource — external executable as source
message DictionaryExecutableSource {
  // Shell command to execute; must emit records on stdout
  string command = 1;
  // ClickHouse input format of the executable output (e.g. TabSeparated)
  string format = 2;
  // When true, the first column is used implicitly as the dictionary key
  optional bool implicit_key = 3;
}

// DictionaryS3Source — S3 object storage as source
message DictionaryS3Source {
  // S3 URL (s3://bucket/path or https://endpoint/bucket/path)
  string url = 1;
  // ClickHouse input format of the S3 object (e.g. Parquet, CSV)
  string format = 2;
  // AWS access key ID; omit to use instance profile / environment credentials
  optional string access_key_id = 3;
  // AWS secret access key (stored as-is; mask before display)
  optional string secret_access_key = 4;
}

// DictionaryExternalSource — union of all supported external sources
message DictionaryExternalSource {
  oneof t {
    DictionaryHttpSource http = 1;
    DictionaryClickHouseSource clickhouse = 2;
    DictionaryMysqlSource mysql = 3;
    DictionaryPostgresqlSource postgresql = 4;
    DictionaryRedisSource redis = 5;
    DictionaryMongoDbSource mongodb = 6;
    DictionaryExecutableSource executable = 7;
    DictionaryS3Source s3 = 8;
  }
}

// OlapDictionary — a ClickHouse Dictionary definition
message OlapDictionary {
  // Dictionary name
  string name = 1;
  // Database where the dictionary is created (empty = default database)
  optional string database = 2;
  // Optional ON CLUSTER name for distributed deployments
  optional string cluster_name = 3;
  // Source: exactly one must be set
  oneof source {
    DictionaryTableSource table_source = 4;
    DictionaryQuerySource query_source = 5;
    DictionaryExternalSource external_source = 6;
  }
  // Primary key column names (single-column = simple key, multi-column = complex key)
  repeated string primary_key = 7;
  // Dictionary attribute columns
  repeated DictionaryColumn columns = 8;
  // Layout type and configuration
  DictionaryLayout layout = 9;
  // Lifetime / refresh policy
  DictionaryLifetime lifetime = 10;
  // Optional invalidation query (checked before reload; if unchanged, skip)
  optional string invalidate_query = 11;
  // Dictionary-level settings map
  map<string, string> settings = 12;
  // Optional COMMENT clause
  optional string comment = 13;
  // Lifecycle management policy
  LifeCycle life_cycle = 14;
  // Optional metadata (description, source file)
  optional Metadata metadata = 15;
}
