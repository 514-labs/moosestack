name = "benchmark"
description = "Standalone query benchmark package for a TypeScript Moose project"
kind = "standalone"
language = "typescript"
template = "typescript-benchmark"
base_path = "query-benchmarks"

docs = """
  1. Add your Moose project to query-benchmarks/package.json as a `pnpm` workspace dependency with `workspace:*`.
  2. Start `moose dev` in your Moose project so its compiled entry stays up to date.
  3. Edit benchmark.config.ts to import your query model from that workspace package,
     then define your base query, scenarios, and thresholds.
  4. From the benchmark package directory, run `pnpm env:preview` to write the
     preview deployment's MOOSE_CLICKHOUSE_CONFIG__* values to .env.preview.
  5. Run the benchmark:
       pnpm bench
"""

npm_deps = [
  "@514labs/moose-lib@latest",
  "@types/node@^20.19.33",
  "dotenv@latest",
  "typescript@^5.7.0",
  "vitest@^3.2.4",
]
shadcn_components = []
moose_exports = []
env = []

[[files]]
src = "package.json"
dest = "package.json"

[[files]]
src = "benchmark.config.ts"
dest = "benchmark.config.ts"

[[files]]
src = "benchmark/core.ts"
dest = "benchmark/core.ts"

[[files]]
src = "tests/query-benchmarks.test.ts"
dest = "tests/query-benchmarks.test.ts"

[[files]]
src = "vitest.config.ts"
dest = "vitest.config.ts"

[[files]]
src = "tsconfig.json"
dest = "tsconfig.json"

[[files]]
src = ".env.preview"
dest = ".env.preview"

[[files]]
src = ".gitignore"
dest = ".gitignore"
