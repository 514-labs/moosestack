version: 2
updates:
  # =============================================================================
  # Root workspace - pnpm catalog pins + root lockfile
  # =============================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "workspace"
    groups:
      workspace-minor-patch:
        update-types: ["minor", "patch"]
      workspace-major:
        update-types: ["major"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "rust"
      - "dependencies"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
      cargo-major:
        update-types: ["major"]

  # =============================================================================
  # Templates & Examples
  # =============================================================================
  - package-ecosystem: "npm"
    directories:
      - "/templates/**"
      - "/examples/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      templates-examples-npm-moose:
        patterns:
          - "@514labs/moose-cli"
          - "@514labs/moose-lib"
      templates-examples-npm-minor-patch:
        update-types: ["minor", "patch"]
      templates-examples-npm-major:
        update-types: ["major"]
    ignore:
      # Keep @types/node at 20.x.x for backward compatibility
      # Node.js 20 is LTS and we want to ensure compatibility
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directories:
      - "/templates/**"
      - "/examples/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      templates-examples-pip-moose:
        patterns:
          - "moose-cli"
          - "moose-lib"
      templates-examples-pip-minor-patch:
        update-types: ["minor", "patch"]
      templates-examples-pip-major:
        update-types: ["major"]
