name: Test VS Code Extension

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/test-vscode-extension.yaml"
      - ".github/workflows/release-vscode-extension.yaml"
      - "apps/vscode-extension/**"
      - "templates/_shared/**"
      - "packages/ts-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test VS Code Extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile --filter @514labs/vscode-extension...

      - name: Run extension test suite
        run: pnpm --filter @514labs/vscode-extension test
